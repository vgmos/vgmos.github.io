<header class="site-header" role="banner">

  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

    <div class="header-actions">
      <nav class="site-nav" aria-label="Primary">
        <div class="trigger">
          <a class="page-link page-link--tools" href="{{ '/#tools' | relative_url }}" data-scroll>Tools</a>
          <a class="page-link page-link--projects" href="{{ '/#projects' | relative_url }}" data-scroll>Projects</a>
          <a class="page-link page-link--notebook" href="{{ '/#notebook' | relative_url }}" data-scroll>Notebook</a>
          <a class="page-link page-link--about" href="{{ '/about/' | relative_url }}">About</a>
        </div>
      </nav>

      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
        <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2.4M12 19.6V22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2 12h2.4M19.6 12H22M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"></path>
          </svg>
        </span>

        <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M20.1 14.8A7.5 7.5 0 0 1 9.2 3.9a8.6 8.6 0 1 0 10.9 10.9Z"></path>
          </svg>
        </span>

        <span class="theme-toggle__label visually-hidden">Switch to dark mode</span>
      </button>
    </div>
  </div>
</header>
