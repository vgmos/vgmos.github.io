---
layout: page
---

{{ content }}

<div class="writing-index">
  <h2>Recent notes</h2>
  <div class="item-list">
    {% for post in site.posts %}
      <article class="list-item list-item--note">
        <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
        <time class="item-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%B %-d, %Y" }}</time>
        {% if post.excerpt %}
          <p class="item-summary">{{ post.excerpt | strip_html | truncate: 220 }}</p>
        {% endif %}
      </article>
    {% else %}
      <p class="quiet-note">No notes have been published yet.</p>
    {% endfor %}
  </div>

  <p class="index-link"><a href="{{ '/writing/index/' | relative_url }}">Chronological index</a></p>
</div>
